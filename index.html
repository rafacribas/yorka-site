<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YORKA STUDIO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background-image: url("soon.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      width: 100vw;
      position: relative;
      overflow: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("soprano.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    body.soprano-active::after {
      opacity: 1;
    }
  </style>
</head>
<body>
  <script>
    (() => {
      const target = "soprano";
      let buffer = "";
      let hideTimer = null;

      const showSoprano = () => {
        document.body.classList.add("soprano-active");
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          document.body.classList.remove("soprano-active");
          hideTimer = null;
        }, 3000);
      };

      window.addEventListener("keydown", (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        const key = event.key.length === 1 ? event.key.toLowerCase() : "";
        if (!key) return;

        buffer = (buffer + key).slice(-target.length);
        if (buffer === target) showSoprano();
      });
    })();
  </script>
</body>
</html>
